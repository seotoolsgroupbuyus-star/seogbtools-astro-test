name: Visual and mobile parity audit (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Validate audit scripts
        run: |
          node --check scripts/visual-compare.mjs
          node --check scripts/mobile-functional-audit.mjs
          node --check scripts/site-paths.mjs
      - name: Compare live and preview
        continue-on-error: true
        run: node scripts/visual-compare.mjs
      - name: Run mobile/functional audit
        continue-on-error: true
        run: node scripts/mobile-functional-audit.mjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-and-mobile-audit
          path: |
            visual-audit/
            mobile-functional-audit/
          if-no-files-found: warn
      - name: Require audit reports before signoff
        run: |
          test -s visual-audit/report.json
          test -s mobile-functional-audit/report.json
