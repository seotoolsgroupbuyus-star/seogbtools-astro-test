name: Original vs Astro preview — visual and mobile audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/visual-compare.mjs'
      - 'scripts/mobile-functional-audit.mjs'
      - 'scripts/site-paths.mjs'
      - 'scripts/build.mjs'
      - 'src/pages/[...slug].astro'
      - '.github/workflows/visual-compare.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Validate source scripts
        run: |
          node --check scripts/build.mjs
          node --check scripts/visual-compare.mjs
          node --check scripts/mobile-functional-audit.mjs
      - name: Screenshot + sitemap + SEO comparison
        continue-on-error: true
        run: node scripts/visual-compare.mjs
      - name: Desktop/mobile functional audit
        continue-on-error: true
        run: node scripts/mobile-functional-audit.mjs
      - name: Upload evidence (JSON reports and screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-vs-preview-site-audit
          path: |
            visual-audit/
            mobile-functional-audit/
          if-no-files-found: warn
      - name: Validate audit reports and flag parity differences
        if: always()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const visualPath="visual-audit/report.json";
            const mobilePath="mobile-functional-audit/report.json";
            let bad=false;
            if(!fs.existsSync(visualPath)){console.error("Missing visual audit report");bad=true;}
            if(!fs.existsSync(mobilePath)){console.error("Missing mobile audit report");bad=true;}
            if(bad)process.exit(1);
            const visual=JSON.parse(fs.readFileSync(visualPath,"utf8"));
            const mobile=JSON.parse(fs.readFileSync(mobilePath,"utf8"));
            const pages=visual.pages||[];
            const stats={
              pages:visual.sitemapCount??pages.length,
              statusMismatches:pages.filter(p=>p.compare?.statusMatch===false).length,
              titleMismatches:pages.filter(p=>p.compare?.titleMatch===false).length,
              descriptionMismatches:pages.filter(p=>p.compare?.descriptionMatch===false).length,
              headingMismatches:pages.filter(p=>p.compare?.h1Match===false||p.compare?.headingsMatch===false).length,
              pagesWithMissingInternalLinks:pages.filter(p=>(p.compare?.missingInternalLinks||[]).length>0).length,
              pagesWithBrokenPreviewImages:pages.filter(p=>(p.compare?.brokenPreviewImages||[]).length>0).length,
              visualDifferencePages:visual.failed??visual.failures?.length??0,
              mobileFunctionalIssues:mobile.issueCount??mobile.issues?.length??0
            };
            console.log("Audit findings:",JSON.stringify(stats,null,2));
            if(stats.visualDifferencePages>0)console.log("::warning::Visual parity differences remain. Review the uploaded JSON report and screenshots; these findings are not being hidden or counted as runtime failures.");
            if(stats.mobileFunctionalIssues>0){console.error("Mobile/functional audit found blocking preview issues.");bad=true;}
            if(stats.statusMismatches>0)console.log("::warning::Some routes have different HTTP status codes and need route-level review.");
            if(stats.pagesWithBrokenPreviewImages>0)console.log("::warning::Preview image loading differences remain and need asset review.");
            if(bad)process.exit(1);
          '
