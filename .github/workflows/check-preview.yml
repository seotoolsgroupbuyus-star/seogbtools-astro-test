name: Verify deployed SEOGBTools Workers website
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/check-preview.mjs
      - .github/workflows/check-preview.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-preview.mjs
      - name: Save deployed-preview results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+bilalfadi@users.noreply.github.com"
          git add reports/preview-check.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify SEOGBTools Workers preview"
            git push
          fi
