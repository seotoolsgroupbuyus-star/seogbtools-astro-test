name: Extract primary product CTAs from live reference
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/primary-cta-audit.mjs
      - .github/workflows/primary-cta-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/primary-cta-audit.mjs
      - name: Store compact audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/primary-cta-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record live primary product purchase links"
            git push
          fi
