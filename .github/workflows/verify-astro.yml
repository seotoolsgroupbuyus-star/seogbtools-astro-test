name: Verify SEOGBTools Astro build and links
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build.mjs
      - 'src/pages/[...slug].astro'
      - content/settings.json
      - content/plans.json
      - public/favicon.svg
      - .github/workflows/verify-astro.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:content
      - name: Check expected favicon/signup/robots in generated homepage
        run: |
          grep -q 'href="/favicon.svg"' .generated/index.html
          grep -q 'name="robots" content="noindex,nofollow"' .generated/index.html
          test -f dist/favicon.svg
