name: Verify SEOGBTools Astro content and SEO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - '.pages.yml'
      - '.github/workflows/verify-astro.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Build static site
        run: npm run build
      - name: Check content, public indexing, sitemap and routes
        run: npm run test:content
      - name: Check generated files
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          grep -q 'https://seogbtools.com/ahrefs-group-buy/' dist/sitemap.xml
          grep -q 'https://seogbtools.com/' dist/sitemap.xml
          grep -q 'name="robots" content="index,follow"' .generated/index.html
          grep -q 'name="robots" content="noindex,follow"' .generated/cart/index.html
          ! grep -q 'https://seogbtools.com/cart/' dist/sitemap.xml
