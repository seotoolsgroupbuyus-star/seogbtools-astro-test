name: Full browser parity audit — original vs Cloudflare
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/full-parity-audit.mjs
      - .github/workflows/full-parity-audit.yml
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/full-parity-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-browser-parity-audit
          path: parity-audit/
          if-no-files-found: ignore
