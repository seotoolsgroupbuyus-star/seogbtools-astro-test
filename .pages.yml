media:
  - name: site_images
    label: Site & Product Images
    input: public/assets/images/site
    output: /assets/images/site
    rename: safe
    categories: [image]
  - name: article_images
    label: Article Images
    input: public/assets/images/articles
    output: /assets/images/articles
    rename: safe
    categories: [image]
  - name: wp_uploads
    label: Migrated WordPress Uploads
    input: public/assets/wp-uploads
    output: /assets/wp-uploads
    rename: false
    categories: [image]
content:
  - name: homepage
    label: Homepage Sections
    type: file
    path: content/homepage.json
    format: json
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: title, type: string }
          - { name: subtitle, type: string }
          - { name: lead, type: text }
          - { name: primaryButton, type: string }
          - { name: secondaryButton, type: string }
          - { name: stat2, type: string }
          - { name: stat3, type: string }
          - { name: logosLabel, type: string }
      - name: why
        label: Why Choose Us
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: title, type: string }
          - { name: lead, type: text }
          - name: cards
            type: object
            list: true
            fields:
              - { name: title, type: string }
              - { name: description, type: text }
      - name: tools
        label: Tools Section
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: title, type: string }
          - { name: lead, type: text }
          - name: categories
            type: object
            list: true
            fields:
              - { name: title, type: string }
              - { name: description, type: text }
      - name: pricing
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: title, type: string }
          - { name: lead, type: text }
      - name: spotlight
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: title, type: string }
          - { name: lead, type: text }
      - name: how
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: title, type: string }
          - { name: lead, type: text }
      - name: faq
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: title, type: string }
          - { name: intro, type: text }
          - { name: topics, type: string, list: true }
  - name: settings
    label: Site Settings & SEO
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: brand, type: string }
      - { name: tagline, type: text }
      - { name: footerRights, type: string }
      - { name: siteUrl, type: string }
      - { name: signupUrl, type: string }
      - { name: whatsappUrl, type: string }
      - { name: messengerUrl, type: string }
      - { name: toolCount, type: string }
      - { name: startingPrice, type: string }
      - { name: defaultSeoDescription, type: text }

      - name: navigation
        label: Main Menu Links
        type: object
        list:
          collapsible: { collapsed: true, summary: "{text}" }
        fields:
          - { name: text, label: Menu Text, type: string }
          - { name: url, label: Link URL, type: string }
      - { name: pagesMenuLabel, label: Pages Menu Heading, type: string }
      - { name: pagesMenuAllLabel, label: Pages Dropdown Link, type: string }
      - name: footerLinks
        label: Footer Links
        type: object
        list:
          collapsible: { collapsed: true, summary: "{text}" }
        fields:
          - { name: text, label: Link Text, type: string }
          - { name: url, label: URL, type: string }
      - name: chat
        label: Chat Widget Text
        type: object
        fields:
          - { name: heading, label: Chat Heading, type: string }
          - { name: whatsappText, label: WhatsApp Button, type: string }
          - { name: messengerText, label: Facebook Button, type: string }
          - { name: footerText, label: Chat Footer, type: string }
      - name: heroLabels
        label: Hero Labels
        type: object
        fields:
          - { name: toolCount, label: Tool Count Caption, type: string }
          - { name: stat2, label: Second Stat Caption, type: string }
          - { name: stat3, label: Third Stat Caption, type: string }
          - { name: pricePrefix, label: Price Note, type: string }
      - name: heroLogos
        label: Homepage Tool Logos (upload)
        type: image
        options: { media: site_images }
        list: true
  - name: products
    label: Products
    type: collection
    path: content/products
    format: json
    filename: "{slug}.json"
    operations: { rename: false, delete: false }
    view: { primary: name, fields: [name, slug, price, category] }
    fields:
      - { name: name, type: string, required: true }
      - { name: slug, type: string, required: true }
      - { name: category, type: string }
      - { name: categories, type: string, list: true }
      - { name: image, label: Featured Image, type: image, options: { media: site_images } }
      - { name: price, type: string }
      - { name: regularPrice, type: string }
      - { name: salePrice, type: string }
      - { name: onSale, type: boolean }
      - { name: shortDescription, type: rich-text, options: { format: html, media: article_images, switcher: false } }
      - { name: description, type: rich-text, options: { format: html, media: article_images, switcher: false } }
      - { name: externalUrl, type: string }
      - { name: seoTitle, type: string }
      - { name: seoDescription, type: text }
      - { name: canonicalUrl, label: Canonical URL Override, type: string }
      - { name: seoH1, type: string }
      - { name: focusKeyword, type: string }
  - name: tools
    label: Homepage Tools
    type: collection
    path: content/tools
    format: json
    filename: "{slug}.json"
    operations: { rename: false, delete: false }
    view: { primary: name }
    fields:
      - { name: id, type: string }
      - { name: name, type: string }
      - { name: slug, type: string }
      - { name: price, type: string }
      - { name: originalPrice, type: string }
      - { name: image, label: Featured Image, type: image, options: { media: site_images } }
      - { name: bgColor, type: string }
      - { name: description, type: text }
      - { name: category, type: string }
      - { name: features, type: string, list: true }
  - name: posts
    label: Blog Posts
    type: collection
    path: content/posts
    format: json
    filename: "{slug}.json"
    operations: { rename: false, delete: false }
    view: { primary: title, fields: [title, slug] }
    fields:
      - { name: title, type: string, required: true }
      - { name: slug, type: string, required: true }
      - { name: image, label: Featured Image, type: image, options: { media: site_images } }
      - { name: content, type: rich-text, options: { format: html, media: article_images, switcher: false } }
      - { name: excerpt, type: rich-text, options: { format: html, media: article_images, switcher: false } }
      - { name: seoTitle, type: string }
      - { name: seoDescription, type: text }
  - name: pages
    label: Website Pages
    type: collection
    path: content/pages
    exclude: [home.json]
    format: json
    filename: "{slug}.json"
    operations: { rename: false, delete: false }
    view: { primary: title }
    fields:
      - { name: title, type: string, required: true }
      - { name: slug, type: string, required: true }
      - { name: content, type: rich-text, options: { format: html, media: article_images, switcher: false } }
      - { name: excerpt, type: rich-text, options: { format: html, media: article_images, switcher: false } }
      - { name: image, label: Featured Image, type: image, options: { media: site_images } }
      - { name: seoTitle, type: string }
      - { name: seoDescription, type: text }
  - name: plans
    label: Pricing Plans
    type: file
    path: content/plans.json
    format: json
    list: true
    fields:
      - { name: name, type: string }
      - { name: price, type: string }
      - { name: popular, type: boolean }
      - { name: tools, type: string, list: true }
      - { name: buyUrl, type: string }
  - name: faqs
    label: FAQs
    type: file
    path: content/faqs.json
    format: json
    list: true
    fields:
      - { name: question, type: string }
      - { name: answer, type: rich-text, options: { format: html, media: article_images, switcher: false } }
  - name: spotlightItems
    label: Spotlight Tool Cards
    type: file
    path: content/spotlight.json
    format: json
    list: true
    fields:
      - { name: name, type: string }
      - { name: description, type: text }
      - { name: features, type: string, list: true }
      - { name: color, type: string }
  - name: howSteps
    label: How It Works Steps
    type: file
    path: content/steps.json
    format: json
    list: true
    fields:
      - { name: number, type: string }
      - { name: title, type: string }
      - { name: description, type: text }
      - { name: icon, type: string }
